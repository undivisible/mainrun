[package]
name = "rust-experiments"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "experiment_runner"
path = "src/main.rs"

[dependencies]
# Core ML framework
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["metal"] }
candle-nn = { git = "https://github.com/huggingface/candle.git", features = ["metal"] }
candle-transformers = { git = "https://github.com/huggingface/candle.git", features = ["metal"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }

# Concurrency and performance
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }

# Data handling
csv = "1.3"
rand = "0.8"
rand_distr = "0.4"
tokenizers = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster compilation while still being optimized