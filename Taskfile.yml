version: '3'

tasks:
  checkpoint:
    dir: scripts
    cmds:
      - npx zx checkpoint.mjs

  download:
    dir: mainrun
    cmds:
      - python3 download_dataset.py

  train:
    deps: [checkpoint, download]
    dir: mainrun
    env:
      MAINRUN_LOCAL: '{{.MAINRUN_LOCAL | default ""}}'
    cmds:
      - python3 train.py

  train-burn:
    dir: burn
    cmds:
      - echo "Burn trainer WIP — see burn/README.md"

  submit:
    deps: [checkpoint]
    dir: scripts
    cmds:
      - npx zx submit.mjs
    